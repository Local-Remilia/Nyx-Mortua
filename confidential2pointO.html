<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidential Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a; /* Dark night sky */
            --text-icy: #a5cddb;
        }

        body {
            background-color: var(--bg-color);
            color: #e5e5e5;
            overflow: hidden;
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        /* Static Noise Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
        }

        /* Snow Canvas */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            filter: blur(0.5px); 
        }

        /* Search Screen */
        #search-screen {
            position: relative;
            z-index: 10;
            transition: opacity 0.5s ease-in-out;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .terminal-box {
            background: rgba(10, 12, 15, 0.75);
            border: 1px solid rgba(165, 205, 219, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(165, 205, 219, 0.05);
            position: relative;
        }

        .terminal-box::before {
            content: '[SYSTEM QUERY]';
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 0.75rem;
            color: var(--text-icy);
            opacity: 0.7;
        }

        /* 3D Scene Setup */
        .scene {
            perspective: 2000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
            opacity: 0;
            z-index: 20;
        }

        .scene.active {
            pointer-events: auto;
            opacity: 1;
        }

        /* Folder Container */
        .folder-wrapper {
            width: 960px; 
            height: 820px; 
            position: relative;
            transform-style: preserve-3d;
            transform: translateY(100vh);
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .scene.active .folder-wrapper {
            transform: translateY(0);
        }

        /* Common Folder Page Styles */
        .folder-page {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            background-color: #e5c387;
            border: 2px solid #c9a565;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1), 10px 10px 30px rgba(0,0,0,0.7);
            transform-style: preserve-3d;
            border-radius: 4px 12px 12px 4px;
        }

        /* Folder Tab */
        .folder-tab {
            position: absolute;
            top: -25px;
            right: 20px;
            width: 120px;
            height: 25px;
            background-color: #e5c387;
            border: 2px solid #c9a565;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        /* Back Cover (Right side, static) */
        .back-cover {
            transform-origin: left center;
        }

        /* Front Cover (Rotates) */
        .front-cover {
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            cursor: pointer;
        }

        .folder-wrapper.open .front-cover {
            transform: rotateY(-180deg);
            cursor: pointer;
        }

        /* Front Cover Exterior */
        .front-exterior {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Front Cover Interior (Left page when open) */
        .front-interior {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            background-color: #eed5a1;
            padding: 40px;
            box-sizing: border-box;
            border-left: 2px solid rgba(0,0,0,0.1);
        }

        /* Stamp */
        .stamp {
            color: #d32f2f;
            border: 5px solid #d32f2f;
            padding: 10px 20px;
            font-size: 3.5rem;
            font-weight: bold;
            transform: rotate(-15deg);
            opacity: 0.8;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Info Fields */
        .info-group {
            margin-bottom: 16px; 
        }
        .info-label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
        }
        .info-value {
            color: #111;
            font-size: 1.2rem;
            border-bottom: 1px dashed #999;
            padding-bottom: 5px;
            min-height: 1.5rem;
            outline: none;
            transition: background 0.2s;
            white-space: pre-wrap; 
            font-family: 'Courier New', Courier, monospace;
        }

        /* Right Page Content */
        .right-page-content {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center;
            background-color: #eed5a1;
            border-radius: 0 12px 12px 0;
            z-index: 1; 
        }

        .right-page-details {
            width: 100%;
            margin-top: 70px;
        }

        .polaroid {
            background: white;
            padding: 15px 15px 50px 15px;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.3);
            transform: rotate(5deg);
            position: relative;
            margin-top: 10px; 
        }

        .polaroid img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            background-color: #ccc;
        }

        /* Paperclip */
        .paperclip {
            position: absolute;
            top: -20px;
            left: 20px;
            width: 30px;
            height: 80px;
            transform: rotate(-15deg);
            z-index: 5;
        }

        /* Back Button */
        #back-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background-color: rgba(239, 68, 68, 0.15); 
            color: #dc2626; 
            border: 2px solid rgba(239, 68, 68, 0.6);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        
        .folder-wrapper.open #back-btn {
            opacity: 1;
            pointer-events: auto;
            transition-delay: 0.8s; 
        }

        #back-btn:hover {
            background-color: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        .typing-error {
            animation: shake 0.4s;
            border-color: #ef4444 !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Environment Overlays -->
    <canvas id="snow-canvas"></canvas>
    <div class="noise"></div>

    <!-- Search Screen -->
    <div id="search-screen">
        <div class="max-w-md w-full p-8 terminal-box rounded-lg">
            
            <p class="text-[var(--text-icy)] text-sm mb-6 text-center opacity-80 border-b border-[var(--text-icy)] pb-4 border-opacity-30">
                &gt; fragmented logs recovered<br>
                &gt; warning: files might be corrupted
            </p>
            
            <h1 class="text-2xl font-bold text-center mb-6 text-white tracking-widest uppercase">ARCHIVE QUERY</h1>
            
            <div class="mb-6">
                <input type="text" id="searchInput" placeholder="ENTER SUBJECT NAME" 
                       class="w-full bg-black/50 border border-gray-600 text-white px-4 py-3 rounded focus:outline-none focus:border-[var(--text-icy)] font-mono text-center uppercase transition-colors placeholder-gray-500">
                <p id="error-msg" class="text-red-500 text-xs mt-2 text-center hidden tracking-wider">RECORD NOT FOUND. ACCESS DENIED.</p>
            </div>
            
            <button onclick="searchRecord()" class="w-full bg-transparent border border-[var(--text-icy)] text-[var(--text-icy)] hover:bg-[var(--text-icy)] hover:text-black font-bold py-3 px-4 rounded transition duration-300 tracking-widest uppercase shadow-[0_0_10px_rgba(165,205,219,0.1)]">
                SEARCH DATABASE
            </button>
        </div>
    </div>

    <!-- 3D Folder Scene -->
    <div id="folder-scene" class="scene">
        <div id="folder" class="folder-wrapper">
            
            <!-- Right Side (Back Cover) -->
            <div class="folder-page back-cover">
                <div class="folder-tab" style="right: auto; left: 20px; top: -20px;"></div>
                <div class="right-page-content">
                    
                    <!-- Polaroid -->
                    <div class="polaroid">
                        <svg class="paperclip" viewBox="0 0 100 250" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 50 10 L 50 200 A 20 20 0 0 0 90 200 L 90 40 A 15 15 0 0 0 60 40 L 60 170 A 10 10 0 0 0 80 170 L 80 60" 
                                  fill="none" stroke="#silver" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="stroke: #9ca3af; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3));"/>
                        </svg>
                        <img id="photo-img" src="" alt="Subject Photo" onerror="this.src='https://placehold.co/200x200/333/fff?text=NO+IMAGE'">
                    </div>
                    
                    <!-- Notes, Status, Gender -->
                    <div class="right-page-details text-left">
                        <div class="info-group">
                            <span class="info-label">Personal Notes</span>
                            <div id="val-notes" class="info-value" style="min-height: 80px;"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Status</span>
                            <div id="val-status" class="info-value font-bold text-red-800"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Gender</span>
                            <div id="val-gender" class="info-value"></div>
                        </div>
                    </div>
                    
                    <!-- Back Button -->
                    <button id="back-btn" onclick="goBack()">GO BACK</button>
                </div>
            </div>

            <!-- Left Side (Front Cover) -->
            <div class="folder-page front-cover" onclick="toggleFolder()">
                <div class="folder-tab"></div>
                
                <!-- Exterior (CONFIDENTIAL) -->
                <div class="front-exterior">
                    <div class="stamp">CONFIDENTIAL</div>
                </div>

                <!-- Interior (Left Page info) -->
                <div class="front-interior">
                    <h2 class="text-3xl font-bold mb-6 text-gray-800 border-b-2 border-gray-800 pb-2" style="font-family: 'Courier New', Courier, monospace;">SUBJECT DOSSIER</h2>
                    
                    <div style="margin-top: 160px;">
                        <div class="info-group">
                            <span class="info-label">Alias</span>
                            <div id="val-alias" class="info-value"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Name</span>
                            <div id="val-name" class="info-value"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Surname</span>
                            <div id="val-surname" class="info-value"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Age</span>
                            <div id="val-age" class="info-value"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Height</span>
                            <div id="val-height" class="info-value"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Occupation / Work</span>
                            <div id="val-work" class="info-value"></div>
                        </div>
                        <div class="info-group">
                            <span class="info-label">Association / Affiliation</span>
                            <div id="val-assoc" class="info-value"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- SNOWFALL CANVAS SIMULATION ---
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function initSnow() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            const particleCount = Math.floor(width / 3); 
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 0.5, 
                    d: Math.random() * Math.PI, 
                    v: Math.random() * 3 + 1 
                });
            }
        }

        let angle = 0;
        function updateAndDrawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; 
            ctx.beginPath();
            
            angle += 0.01;
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
                
                p.y += p.v;
                p.x += Math.sin(angle + p.d) + 0.5; 
                
                if (p.y > height) {
                    particles[i] = { x: Math.random() * width, y: -10, r: p.r, d: p.d, v: p.v };
                }
                if (p.x > width + 5) {
                    particles[i] = { x: -5, y: Math.random() * height, r: p.r, d: p.d, v: p.v };
                }
            }
            
            ctx.fill();
            requestAnimationFrame(updateAndDrawSnow);
        }

        window.addEventListener('resize', initSnow);
        initSnow();
        updateAndDrawSnow();

        // --- DATABASE & FOLDER LOGIC ---
        const database = [
            {
                alias: "The Fixer",
                name: "Giovanni",
                surname: "Archivio",
                age: "67",
                gender: "Male",
                height: "182 cm",
                work: "fixer",
                assoc: "Hana assoc.",
                status: "MISSING",
                notes: "Subject has been off the grid for 3 weeks. Last seen near the docks.\nSuspected of hoarding classified Hana tech.",
                photo: "https://thispersondoesnotexist.com/"
            },
            {
                alias: "Cipher",
                name: "Jane",
                surname: "Smith",
                age: "35",
                gender: "Female",
                height: "165 cm",
                work: "Cryptanalyst",
                assoc: "MI6 / Section 4",
                status: "ACTIVE",
                notes: "Highly skilled in breaking modern encryption. Currently assigned to Project X. Do not engage without authorization.",
                photo: "https://placehold.co/200x200/555/fff?text=J.SMITH"
            },
            {
                alias: "Enigma",
                name: "Alan",
                surname: "Turing",
                age: "41",
                gender: "Male",
                height: "178 cm",
                work: "Mathematician",
                assoc: "Bletchley Park",
                status: "DECEASED",
                notes: "Pioneered early computing logic. Critical to wartime intelligence.",
                photo: "https://placehold.co/200x200/555/fff?text=A.TURING"
            }
        ];

        function searchRecord() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            const errorMsg = document.getElementById('error-msg');
            
            // Basic matching
            const record = database.find(r => 
                `${r.name.toLowerCase()} ${r.surname.toLowerCase()}` === input ||
                `${r.name.toLowerCase()}` === input ||
                `${r.surname.toLowerCase()}` === input
            );

            if (record) {
                errorMsg.classList.add('hidden');
                
                // Populate data
                document.getElementById('val-alias').innerText = record.alias;
                document.getElementById('val-name').innerText = record.name;
                document.getElementById('val-surname').innerText = record.surname;
                document.getElementById('val-age').innerText = record.age;
                document.getElementById('val-gender').innerText = record.gender; 
                document.getElementById('val-height').innerText = record.height;
                document.getElementById('val-work').innerText = record.work;
                document.getElementById('val-assoc').innerText = record.assoc;
                document.getElementById('val-notes').innerText = record.notes;
                document.getElementById('val-status').innerText = record.status;
                document.getElementById('photo-img').src = record.photo;

                // Transition scenes
                document.getElementById('search-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('search-screen').style.display = 'none';
                    document.getElementById('folder-scene').classList.add('active');
                }, 500);

            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('searchInput').classList.add('typing-error');
                setTimeout(() => {
                    document.getElementById('searchInput').classList.remove('typing-error');
                }, 400);
            }
        }

        // Allow Enter key to trigger search
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchRecord();
        });

        // Toggles the folder open and closed
        function toggleFolder() {
            const folder = document.getElementById('folder');
            folder.classList.toggle('open');
        }

        // Returns to the search screen with staged animations
        function goBack() {
            const folder = document.getElementById('folder');
            
            // 1. Close the folder visually
            folder.classList.remove('open');
            
            // 2. Wait 1 second for the cover to shut, then FORCE slide down while scene is still active
            setTimeout(() => {
                folder.style.transform = 'translateY(100vh)';
                
                // 3. Wait 1.5 seconds for it to slide down, then clean up the scene and bring search terminal back
                setTimeout(() => {
                    document.getElementById('folder-scene').classList.remove('active');
                    folder.style.transform = ''; // Reset transform so it works normally next time
                    
                    const searchScreen = document.getElementById('search-screen');
                    searchScreen.style.display = 'flex';
                    
                    // Slight delay to process display:flex before transitioning opacity
                    setTimeout(() => {
                        searchScreen.style.opacity = '1';
                        const input = document.getElementById('searchInput');
                        input.value = ''; // Clear previous search
                        input.focus();    // Ready for the next search
                    }, 50);
                }, 1500); 
            }, 1000); 
        }
    </script>
</body>
</html>
