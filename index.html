<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx-Mortua | Winter Wasteland</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --text-main: #e2e8f0;
            --text-icy: #a5cddb;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; /* Prevent scrolling, keeps it feeling enclosed */
        }

        /* Flash Photography / Vignette Effect */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 60%, rgba(0,0,0,1) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Static Noise Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 6;
        }

        /* Snow Canvas */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            /* Slight blur to make some flakes feel out of focus (depth of field) */
            filter: blur(0.5px); 
        }

        /* Main Content Container */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        /* Brutalist Title */
        h1 {
            font-family: 'Special Elite', cursive;
            font-size: 3.5rem;
            letter-spacing: 0.2em;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3), 0 0 5px rgba(165, 205, 219, 0.5);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            h1 { font-size: 5rem; }
        }

        /* Terminal Text Area */
        .log-container {
            max-width: 600px;
            width: 100%;
            background: rgba(10, 12, 15, 0.6);
            border-left: 3px solid var(--text-icy);
            padding: 1.5rem;
            margin-top: 2rem;
            text-align: left;
            position: relative;
        }

        .log-container::before {
            content: '[REC. LOG // ' attr(data-time) ']';
            position: absolute;
            top: -12px;
            left: 10px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 0.75rem;
            color: var(--text-icy);
            opacity: 0.7;
        }

        #typed-text {
            color: #caced5;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 120px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: var(--text-icy);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Survivalist Button */
        .vault-btn {
            margin-top: 3rem;
            display: inline-block;
            padding: 1rem 2rem;
            font-family: 'Special Elite', cursive;
            font-size: 1.2rem;
            color: #000;
            background: var(--text-icy);
            border: 2px solid var(--text-icy);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(165, 205, 219, 0.2);
            position: relative;
            overflow: hidden;
        }

        .vault-btn:hover {
            background: transparent;
            color: var(--text-icy);
            box-shadow: 0 0 25px rgba(165, 205, 219, 0.4), inset 0 0 10px rgba(165, 205, 219, 0.2);
        }

        .vault-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .vault-btn:hover::before {
            left: 100%;
        }

        /* Subtle environment details */
        .temp-reading {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: var(--text-icy);
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <!-- Environment Overlays -->
    <canvas id="snow-canvas"></canvas>
    <div class="vignette"></div>
    <div class="noise"></div>

    <div class="temp-reading">EXT. TEMP: -34°C<br>SIGNAL: WEAK</div>

    <!-- Main Content -->
    <main class="content-wrapper">
        
        <header>
            <h1>Nyx-Mortua</h1>
            <p class="text-sm tracking-[0.4em] uppercase text-[#a5cddb] opacity-60">Site Zero // Abandoned</p>
        </header>

        <div class="log-container" data-time="03:14 AM">
            <div id="typed-text-container">
                <span id="typed-text"></span><span class="cursor"></span>
            </div>
        </div>

        <a href="https://local-remilia.github.io/Nyx-Mortua/confidential2pointO.html" class="vault-btn">
            Open Vault
        </a>

    </main>

    <script>
        // --- TYPEWRITER EFFECT ---
        document.addEventListener('DOMContentLoaded', () => {
            const textElement = document.getElementById('typed-text');
            const lines = [
                "RECOVERING FRAGMENTED LOGS...",
                "...",
                "Severe blizzard conditions detected. Power grid offline.",
                "This repository contains the last known survival logs, lost data, and recovered files from the winter wasteland.",
                "Warning: recovered files may contain missing or corrupted data..."
            ];
            
            let lineIndex = 0;
            let charIndex = 0;

            function typeWriter() {
                if (lineIndex < lines.length) {
                    if (charIndex < lines[lineIndex].length) {
                        textElement.innerHTML += lines[lineIndex].charAt(charIndex);
                        charIndex++;
                        
                        let speed = Math.random() * 40 + 20; 
                        setTimeout(typeWriter, speed);
                    } else {
                        textElement.innerHTML += '<br><br>';
                        lineIndex++;
                        charIndex = 0;
                        setTimeout(typeWriter, 500); // Pause between lines
                    }
                }
            }

            // Start typing after a short delay
            setTimeout(typeWriter, 1000);
            
            // Set dynamic timestamp
            const logContainer = document.querySelector('.log-container');
            const now = new Date();
            logContainer.setAttribute('data-time', now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' }));
        });

        // --- SNOWFALL CANVAS SIMULATION ---
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function initSnow() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Generate particles
            const particleCount = Math.floor(width / 3); // Scale snow with screen width
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2 + 0.5, // radius (flake size)
                    d: Math.random() * Math.PI, // density (used for sway)
                    v: Math.random() * 3 + 1 // velocity
                });
            }
        }

        let angle = 0;
        function updateAndDrawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; // Stark white snow
            ctx.beginPath();
            
            angle += 0.01;
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
                
                // Update position
                // y increases (falling down), x moves left/right based on angle and density
                p.y += p.v;
                p.x += Math.sin(angle + p.d) + 0.5; // Slight wind to the right
                
                // If flake reaches bottom or sides, respawn it
                if (p.y > height) {
                    particles[i] = { x: Math.random() * width, y: -10, r: p.r, d: p.d, v: p.v };
                }
                if (p.x > width + 5) {
                    particles[i] = { x: -5, y: Math.random() * height, r: p.r, d: p.d, v: p.v };
                }
            }
            
            ctx.fill();
            requestAnimationFrame(updateAndDrawSnow);
        }

        // Handle resize
        window.addEventListener('resize', initSnow);

        // Start snow
        initSnow();
        updateAndDrawSnow();
    </script>
</body>
</html>
